name: CI Build & Lint Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff Lint Check
        run: uv run ruff check scripts/

      - name: Build Site Verification
        run: uv run python scripts/build_site.py --only 00_introduction
